<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications & Feed – Enterprise360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="toast-container"></div>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
          <h5 class="mb-1 fw-bold">Communications & Notifications Hub</h5>
          <p class="text-muted mb-0" style="font-size:.85rem">Internal bulletin board, system alerts, reminders, and activity stream</p>
        </div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary btn-sm" id="markAllRead"><i class="bi bi-check-all me-1"></i>Mark All Read</button>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#announceModal"><i class="bi bi-megaphone me-1"></i>Post Announcement</button>
        </div>
      </div>

      <div class="row g-3">
        <!-- Notifications List -->
        <div class="col-lg-7">
          <div class="card shadow-sm h-100">
            <div class="card-header d-flex justify-content-between align-items-center bg-transparent">
              <span class="card-title fw-bold">System Alerts & Notifications <span id="unreadBadge" class="badge bg-danger ms-1"></span></span>
              <div class="d-flex gap-2">
                <select class="form-select form-select-sm" id="notifFilter" style="width:120px">
                  <option value="">All Alerts</option>
                  <option value="unread">Unread Only</option>
                  <option value="read">Read Only</option>
                </select>
              </div>
            </div>
            <div id="notifList" class="overflow-auto" style="max-height: 580px;"></div>
          </div>
        </div>

        <!-- Announcements + Reminders -->
        <div class="col-lg-5">
          <div class="card mb-3 shadow-sm">
            <div class="card-header bg-transparent"><span class="card-title fw-bold">Company Announcements</span></div>
            <div id="announceList" style="max-height:300px;overflow-y:auto"></div>
          </div>
          <div class="card shadow-sm">
            <div class="card-header bg-transparent d-flex justify-content-between align-items-center">
              <span class="card-title fw-bold">Personal Reminders</span>
              <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#reminderModal"><i class="bi bi-plus-lg"></i></button>
            </div>
            <div id="reminderList" class="card-body"></div>
          </div>
        </div>

        <!-- Activity Timeline -->
        <div class="col-12 mt-4">
          <div class="card shadow-sm">
            <div class="card-header bg-transparent"><span class="card-title fw-bold">Enterprise Operational Activity Stream</span></div>
            <div class="card-body" id="timeline"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Announcement Modal -->
<div class="modal fade" id="announceModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title">Post New Company Announcement</h6>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Announcement Title *</label>
          <input type="text" class="form-control" id="annTitle" placeholder="e.g. Quarterly Town Hall Meeting" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Message Content *</label>
          <textarea class="form-control" id="annMessage" rows="4" placeholder="Detail the agenda, location, and participants…" required></textarea>
        </div>
        <div class="mb-3">
          <label class="form-label">Priority Level</label>
          <select class="form-select" id="annPriority">
            <option value="High">High Urgency</option>
            <option value="Medium" selected>Standard / Medium</option>
            <option value="Low">Low / General</option>
          </select>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveAnnBtn"><i class="bi bi-send me-1"></i>Publish Announcement</button>
      </div>
    </div>
  </div>
</div>

<!-- Reminder Modal -->
<div class="modal fade" id="reminderModal" tabindex="-1">
  <div class="modal-dialog modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title">Add Follow-up Reminder</h6>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Reminder Task</label>
          <input type="text" class="form-control" id="remText" placeholder="e.g. Call TechCorp procurement" required>
        </div>
        <div class="mb-3">
          <label class="form-label">Target Date & Time</label>
          <input type="datetime-local" class="form-control" id="remDateTime" required>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveRemBtn"><i class="bi bi-check-lg me-1"></i>Save Reminder</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/notifications.js"></script>
</body>
</html>
