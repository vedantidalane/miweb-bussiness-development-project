<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Notifications – Enterprise360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-container"></div>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div><h5 class="mb-1 fw-bold">Notifications & Communication</h5><p class="text-muted mb-0" style="font-size:.85rem">Stay updated with all activity</p></div>
        <div class="d-flex gap-2">
          <button class="btn btn-outline-secondary btn-sm" id="markAllRead"><i class="bi bi-check-all me-1"></i>Mark All Read</button>
          <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#announceModal"><i class="bi bi-megaphone me-1"></i>New Announcement</button>
        </div>
      </div>

      <div class="row g-3">
        <!-- Notifications List -->
        <div class="col-lg-7">
          <div class="card">
            <div class="card-header">
              <span class="card-title">Notifications <span id="unreadBadge" class="badge bg-danger ms-1"></span></span>
              <div class="d-flex gap-2">
                <select class="form-select form-select-sm" id="notifFilter" style="width:120px">
                  <option value="">All</option><option value="unread">Unread</option><option value="read">Read</option>
                </select>
              </div>
            </div>
            <div id="notifList"></div>
          </div>
        </div>

        <!-- Announcements + Reminders -->
        <div class="col-lg-5">
          <div class="card mb-3">
            <div class="card-header"><span class="card-title">Announcements</span></div>
            <div id="announceList" style="max-height:340px;overflow-y:auto"></div>
          </div>
          <div class="card">
            <div class="card-header">
              <span class="card-title">Reminders</span>
              <button class="btn btn-sm btn-outline-primary" data-bs-toggle="modal" data-bs-target="#reminderModal"><i class="bi bi-plus"></i></button>
            </div>
            <div id="reminderList" class="card-body"></div>
          </div>
        </div>

        <!-- Activity Timeline -->
        <div class="col-12">
          <div class="card">
            <div class="card-header"><span class="card-title">Activity Timeline</span></div>
            <div class="card-body" id="timeline"></div>
          </div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Announcement Modal -->
<div class="modal fade" id="announceModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h6 class="modal-title">New Announcement</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label">Title *</label><input type="text" class="form-control" id="annTitle"></div>
      <div class="mb-3"><label class="form-label">Message *</label><textarea class="form-control" id="annMessage" rows="4"></textarea></div>
      <div class="mb-3"><label class="form-label">Priority</label>
        <select class="form-select" id="annPriority"><option value="High">High</option><option value="Medium">Medium</option><option value="Low">Low</option></select>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="saveAnnBtn">Post</button></div>
  </div></div>
</div>

<!-- Reminder Modal -->
<div class="modal fade" id="reminderModal" tabindex="-1">
  <div class="modal-dialog modal-sm"><div class="modal-content">
    <div class="modal-header"><h6 class="modal-title">Add Reminder</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label">Reminder</label><input type="text" class="form-control" id="remText" placeholder="e.g. Review Q4 reports"></div>
      <div class="mb-3"><label class="form-label">Date & Time</label><input type="datetime-local" class="form-control" id="remDateTime"></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="saveRemBtn">Add</button></div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
(function() {
  const { Storage, Session } = window.E360;
  const { showToast, genId, formatDate, formatDateTime, timeAgo, today, formatCurrency, getInitials, avatarColor, avatarHtml, statusBadge, priorityBadge, debounce, throttle, confirm, paginate, renderPagination, searchFilter, sortBy, exportCSV, previewImage, fetchData, skeletonRow, showLoading } = window.E360.Utils;
  const { Auth, getSampleData } = window.E360;
  const { initPage, renderSidebar, renderTopbar } = window.E360.App;


  let notifications=[], announcements=[], reminders=[];

  async function init() {
    const user = await initPage('Notifications', 'notifications.html');
    if (!user) return;
    const data = await getSampleData();
    notifications  = Storage.get('notifications', data.notifications);
    announcements  = Storage.get('announcements', data.announcements);
    reminders      = Storage.get('reminders', []);

    renderNotifs(); renderAnnouncements(); renderReminders(); renderTimeline();

    document.getElementById('markAllRead').addEventListener('click', () => {
      notifications.forEach(n=>n.read=true);
      Storage.set('notifications', notifications); renderNotifs();
      showToast('All notifications marked as read.','success');
    });
    document.getElementById('notifFilter').addEventListener('change', renderNotifs);
    document.getElementById('saveAnnBtn').addEventListener('click', saveAnnouncement);
    document.getElementById('saveRemBtn').addEventListener('click', saveReminder);
  }

  const typeIcon = { info:'bi-info-circle-fill text-info', success:'bi-check-circle-fill text-success', warning:'bi-exclamation-triangle-fill text-warning', danger:'bi-x-circle-fill text-danger' };
  const typeBorder = { info:'border-info', success:'border-success', warning:'border-warning', danger:'border-danger' };

  function renderNotifs() {
    const filter = document.getElementById('notifFilter').value;
    let list = [...notifications].sort((a,b)=>new Date(b.time)-new Date(a.time));
    if (filter==='unread') list=list.filter(n=>!n.read);
    if (filter==='read') list=list.filter(n=>n.read);
    const unread = notifications.filter(n=>!n.read).length;
    const badge = document.getElementById('unreadBadge');
    badge.textContent = unread||''; badge.style.display = unread?'':'none';

    document.getElementById('notifList').innerHTML = list.length ? list.map(n => `
      <div class="notif-item ${n.read?'':'unread'}" id="notif-${n.id}">
        <i class="bi ${typeIcon[n.type]||'bi-bell-fill'}" style="font-size:1rem;margin-top:3px"></i>
        <div class="flex-1">
          <div style="font-size:.85rem;font-weight:${n.read?400:600}">${n.title}</div>
          <div class="text-muted" style="font-size:.78rem">${n.message}</div>
          <div class="text-muted mt-1" style="font-size:.72rem">${timeAgo(n.time)}</div>
        </div>
        <div class="d-flex flex-column gap-1 align-items-end">
          ${!n.read ? `<button class="btn btn-sm btn-outline-primary py-0 mark-read" data-id="${n.id}" style="font-size:.72rem">Mark read</button>` : ''}
          <button class="btn-icon text-danger del-notif" data-id="${n.id}" style="width:22px;height:22px;font-size:.8rem"><i class="bi bi-trash"></i></button>
        </div>
        ${!n.read ? `<span class="notif-dot bg-${n.type==='danger'?'danger':n.type==='warning'?'warning':'primary'}"></span>` : ''}
      </div>`).join('')
      : `<div class="empty-state py-4"><i class="bi bi-bell-slash"></i><h6>No notifications</h6></div>`;

    document.querySelectorAll('.mark-read').forEach(b=>b.addEventListener('click',()=>{
      const n=notifications.find(n=>n.id===+b.dataset.id); if(n){n.read=true;Storage.set('notifications',notifications);renderNotifs();}
    }));
    document.querySelectorAll('.del-notif').forEach(b=>b.addEventListener('click',()=>{
      notifications=notifications.filter(n=>n.id!==+b.dataset.id);
      Storage.set('notifications',notifications); renderNotifs();
      showToast('Notification removed.','info');
    }));
  }

  function renderAnnouncements() {
    const pColors={High:'danger',Medium:'warning',Low:'success'};
    document.getElementById('announceList').innerHTML = announcements.length ? announcements.map(a => `
      <div class="d-flex gap-3 p-3 border-bottom">
        <div class="flex-shrink-0"><i class="bi bi-megaphone-fill text-${pColors[a.priority]||'primary'}" style="font-size:1.1rem"></i></div>
        <div class="flex-1">
          <div class="d-flex justify-content-between align-items-start">
            <div class="fw-semibold" style="font-size:.88rem">${a.title}</div>
            <span class="badge bg-${pColors[a.priority]||'secondary'} bg-opacity-15 text-${pColors[a.priority]||'secondary'}" style="font-size:.7rem">${a.priority}</span>
          </div>
          <div class="text-muted mt-1" style="font-size:.8rem">${a.message}</div>
          <div class="text-muted mt-1" style="font-size:.72rem"><i class="bi bi-person me-1"></i>${a.author} · ${a.date}</div>
        </div>
      </div>`).join('')
      : `<div class="empty-state py-3"><i class="bi bi-megaphone"></i><h6>No announcements</h6></div>`;
  }

  function renderReminders() {
    document.getElementById('reminderList').innerHTML = reminders.length ? `<div class="timeline">${reminders.map(r => `
      <div class="timeline-item">
        <div class="timeline-dot bg-warning"></div>
        <div class="timeline-content">
          <div style="font-size:.85rem;font-weight:500">${r.text}</div>
          <div class="text-muted timeline-time">${formatDateTime(r.dateTime)}</div>
        </div>
      </div>`).join('')}</div>`
      : `<div class="empty-state py-2"><i class="bi bi-alarm"></i><h6>No reminders</h6></div>`;
  }

  function renderTimeline() {
    const allActivity = [
      ...notifications.map(n=>({time:n.time, icon:typeIcon[n.type]||'bi-bell-fill', title:n.title, desc:n.message})),
    ].sort((a,b)=>new Date(b.time)-new Date(a.time)).slice(0,10);
    document.getElementById('timeline').innerHTML = allActivity.length ? `<div class="timeline">${allActivity.map(a=>`
      <div class="timeline-item">
        <div class="timeline-dot bg-primary"></div>
        <div class="timeline-content">
          <div style="font-size:.85rem;font-weight:600">${a.title}</div>
          <div class="text-muted" style="font-size:.78rem">${a.desc}</div>
          <div class="timeline-time">${timeAgo(a.time)}</div>
        </div>
      </div>`).join('')}</div>`
      : `<div class="empty-state py-2"><i class="bi bi-clock-history"></i><h6>No recent activity</h6></div>`;
  }

  function saveAnnouncement() {
    const title=document.getElementById('annTitle').value.trim();
    const message=document.getElementById('annMessage').value.trim();
    if(!title||!message){showToast('Title and message required.','warning');return;}
    const ann={id:genId(),title,message,priority:document.getElementById('annPriority').value,date:new Date().toISOString().split('T')[0],author:'You'};
    announcements.unshift(ann); Storage.set('announcements',announcements);
    bootstrap.Modal.getInstance(document.getElementById('announceModal')).hide();
    document.getElementById('annTitle').value=''; document.getElementById('annMessage').value='';
    renderAnnouncements(); showToast('Announcement posted!','success');
  }

  function saveReminder() {
    const text=document.getElementById('remText').value.trim();
    const dateTime=document.getElementById('remDateTime').value;
    if(!text||!dateTime){showToast('Text and date required.','warning');return;}
    reminders.push({id:genId(),text,dateTime});
    Storage.set('reminders',reminders);
    bootstrap.Modal.getInstance(document.getElementById('reminderModal')).hide();
    renderReminders(); showToast('Reminder added!','success');
  }

  init();

})();
</script>
</body>
</html>
