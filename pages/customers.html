<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customers & CRM – Enterprise360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="toast-container"></div>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
          <h5 class="mb-1 fw-bold">CRM – Customer Management</h5>
          <p class="text-muted mb-0" style="font-size:.85rem">Manage enterprise customer accounts, sales opportunities, and deal pipelines</p>
        </div>
        <button class="btn btn-primary" id="addCustBtn"><i class="bi bi-plus-lg me-2"></i>Add Customer</button>
      </div>

      <div class="row g-3 mb-4" id="crmStats"></div>

      <!-- Sales Pipeline -->
      <div class="card mb-4 shadow-sm">
        <div class="card-header bg-transparent border-bottom">
          <span class="card-title fw-bold">Deal Flow & Pipeline Stages</span>
        </div>
        <div class="card-body">
          <div class="d-flex gap-3 overflow-auto pb-2" id="pipeline"></div>
        </div>
      </div>

      <!-- Filters + Table -->
      <div class="card shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span class="card-title fw-bold" id="custCount">Customers</span>
          <div class="d-flex gap-2">
            <button class="btn btn-sm btn-outline-secondary" id="exportCustBtn"><i class="bi bi-download me-1"></i>Export CSV</button>
          </div>
        </div>
        <div class="card-body py-3 border-bottom">
          <div class="row g-2 align-items-center">
            <div class="col-sm-5">
              <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" class="form-control" id="custSearch" placeholder="Search by company, contact, or email…">
              </div>
            </div>
            <div class="col-sm-3">
              <select class="form-select" id="custTypeFilter">
                <option value="">All Account Types</option>
                <option>Client</option>
                <option>Lead</option>
              </select>
            </div>
            <div class="col-sm-4">
              <select class="form-select" id="custStatusFilter">
                <option value="">All Statuses</option>
                <option>Active</option>
                <option>Inactive</option>
              </select>
            </div>
          </div>
        </div>
        <div class="table-wrapper">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th>Company</th>
                <th>Contact</th>
                <th>Type</th>
                <th>Lead Status</th>
                <th>Deal Value</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="custTable"></tbody>
          </table>
        </div>
        <div class="card-body border-top d-flex justify-content-between align-items-center py-2 flex-wrap gap-2">
          <div class="text-muted" style="font-size:.82rem" id="custPageInfo"></div>
          <div id="custPagination"></div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Customer Modal -->
<div class="modal fade" id="custModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="custModalTitle">Add Customer</h6>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-sm-6">
            <label class="form-label">Company Name *</label>
            <input type="text" class="form-control" id="custName" placeholder="e.g. Acme Global Inc." required>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Contact Person</label>
            <input type="text" class="form-control" id="custContact" placeholder="e.g. Sarah Jenkins">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Email Address</label>
            <input type="email" class="form-control" id="custEmail" placeholder="sarah@acmeglobal.com">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Phone Number</label>
            <input type="text" class="form-control" id="custPhone" placeholder="+1-555-0199">
          </div>
          <div class="col-sm-4">
            <label class="form-label">Account Type</label>
            <select class="form-select" id="custType">
              <option value="Client">Client</option>
              <option value="Lead">Lead</option>
            </select>
          </div>
          <div class="col-sm-4">
            <label class="form-label">Pipeline Stage</label>
            <select class="form-select" id="custLeadStatus">
              <option>Prospect</option>
              <option>Negotiation</option>
              <option>Won</option>
              <option>Lost</option>
            </select>
          </div>
          <div class="col-sm-4">
            <label class="form-label">Estimated Deal Value (USD)</label>
            <input type="number" class="form-control" id="custValue" placeholder="50000">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Status</label>
            <select class="form-select" id="custActive">
              <option value="Active">Active</option>
              <option value="Inactive">Inactive</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Customer Notes & Follow-up History</label>
            <textarea class="form-control" id="custNotes" rows="3" placeholder="Enter meeting outcomes or contract notes…"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveCustBtn"><i class="bi bi-check-lg me-1"></i>Save Customer</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/customers.js"></script>
</body>
</html>
