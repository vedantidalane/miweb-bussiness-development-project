<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inventory Management – Enterprise360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="toast-container"></div>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
          <h5 class="mb-1 fw-bold">Inventory Management</h5>
          <p class="text-muted mb-0" style="font-size:.85rem">Real-time stock level monitoring, procurement orders, and movements</p>
        </div>
        <button class="btn btn-primary" id="addProdBtn"><i class="bi bi-plus-lg me-2"></i>Add Product</button>
      </div>

      <div class="row g-3 mb-4" id="invStats"></div>

      <!-- Low Stock Warning Banner -->
      <div id="lowStockAlert" class="alert alert-warning d-flex align-items-center gap-2 mb-4 shadow-sm" role="alert" style="display:none!important">
        <i class="bi bi-exclamation-triangle-fill fs-5 text-warning"></i>
        <span id="lowStockMsg" class="fw-medium"></span>
      </div>

      <!-- Filters -->
      <div class="card mb-3 shadow-sm">
        <div class="card-body py-3">
          <div class="row g-2 align-items-center">
            <div class="col-sm-5">
              <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" class="form-control" id="prodSearch" placeholder="Search by SKU, product name, or supplier…">
              </div>
            </div>
            <div class="col-sm-3">
              <select class="form-select" id="catFilter"><option value="">All Product Categories</option></select>
            </div>
            <div class="col-sm-3">
              <select class="form-select" id="stockFilter">
                <option value="">All Stock Statuses</option>
                <option value="In Stock">In Stock</option>
                <option value="Low Stock">Low Stock</option>
                <option value="Out of Stock">Out of Stock</option>
              </select>
            </div>
            <div class="col-auto ms-auto">
              <button class="btn btn-sm btn-outline-secondary" id="exportInvBtn"><i class="bi bi-download me-1"></i>Export CSV</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Products Table -->
      <div class="card shadow-sm">
        <div class="card-header"><span class="card-title fw-bold" id="prodCount">Products</span></div>
        <div class="table-wrapper">
          <table class="table table-hover mb-0">
            <thead>
              <tr>
                <th>Product Name</th>
                <th>SKU</th>
                <th>Category</th>
                <th>Supplier</th>
                <th>Unit Price</th>
                <th>In Stock</th>
                <th>Min Threshold</th>
                <th>Status</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="prodTable"></tbody>
          </table>
        </div>
        <div class="card-body border-top d-flex justify-content-between align-items-center py-2 flex-wrap gap-2">
          <div class="text-muted" style="font-size:.82rem" id="prodPageInfo"></div>
          <div id="prodPagination"></div>
        </div>
      </div>

      <!-- Stock Movement Log -->
      <div class="card mt-4 shadow-sm">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span class="card-title fw-bold">Stock Movement & Audit Log</span>
          <button class="btn btn-sm btn-primary" id="stockMovBtn"><i class="bi bi-arrow-left-right me-1"></i>Record Stock In/Out</button>
        </div>
        <div class="card-body" id="stockLog"></div>
      </div>

    </main>
  </div>
</div>

<!-- Product Modal -->
<div class="modal fade" id="prodModal" tabindex="-1">
  <div class="modal-dialog modal-lg">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="prodModalTitle">Add Product</h6>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-sm-8">
            <label class="form-label">Product Name *</label>
            <input type="text" class="form-control" id="prodName" placeholder="e.g. Ergonomic Office Desk" required>
          </div>
          <div class="col-sm-4">
            <label class="form-label">SKU Code</label>
            <input type="text" class="form-control" id="prodSku" placeholder="e.g. DSK-1002">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Category</label>
            <select class="form-select" id="prodCat">
              <option>Electronics</option>
              <option>Furniture</option>
              <option>Stationery</option>
              <option>Software</option>
              <option>Other</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Supplier Name</label>
            <input type="text" class="form-control" id="prodSupplier" placeholder="e.g. ModernWork Supplies">
          </div>
          <div class="col-sm-4">
            <label class="form-label">Unit Price (USD)</label>
            <input type="number" class="form-control" id="prodPrice" placeholder="250">
          </div>
          <div class="col-sm-4">
            <label class="form-label">Quantity in Stock</label>
            <input type="number" class="form-control" id="prodQty" min="0" value="10">
          </div>
          <div class="col-sm-4">
            <label class="form-label">Min Stock Level Threshold</label>
            <input type="number" class="form-control" id="prodMin" min="0" value="5">
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveProdBtn"><i class="bi bi-check-lg me-1"></i>Save Product</button>
      </div>
    </div>
  </div>
</div>

<!-- Stock Movement Modal -->
<div class="modal fade" id="stockModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title">Record Stock Movement</h6>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="mb-3">
          <label class="form-label">Select Product</label>
          <select class="form-select" id="stockProduct"></select>
        </div>
        <div class="mb-3">
          <label class="form-label">Movement Direction</label>
          <select class="form-select" id="stockMovType">
            <option value="in">Stock-In (Procurement / Received)</option>
            <option value="out">Stock-Out (Dispatched / Consumed)</option>
          </select>
        </div>
        <div class="mb-3">
          <label class="form-label">Quantity</label>
          <input type="number" class="form-control" id="stockQty" min="1" value="1">
        </div>
        <div class="mb-3">
          <label class="form-label">Audit Note / PO Reference</label>
          <input type="text" class="form-control" id="stockNote" placeholder="e.g. PO #8892 restocking from supplier">
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveStockBtn"><i class="bi bi-check2-circle me-1"></i>Commit Movement</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/inventory.js"></script>
</body>
</html>
