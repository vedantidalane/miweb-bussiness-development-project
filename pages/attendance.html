<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance – Enterprise360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-container"></div>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div><h5 class="mb-1 fw-bold">Attendance Management</h5><p class="text-muted mb-0" style="font-size:.85rem">Track daily attendance</p></div>
        <div class="d-flex gap-2">
          <input type="date" class="form-control" id="attDate" style="width:160px">
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#attModal"><i class="bi bi-plus-lg me-2"></i>Mark Attendance</button>
        </div>
      </div>

      <div class="row g-3 mb-4" id="attStats"></div>

      <!-- Tabs -->
      <div class="card">
        <div class="card-header">
          <ul class="nav nav-tabs card-header-tabs">
            <li class="nav-item"><button class="nav-link active" id="tab-daily" data-tab="daily">Daily View</button></li>
            <li class="nav-item"><button class="nav-link" id="tab-leaves" data-tab="leaves">Leave Requests</button></li>
          </ul>
        </div>
        <div id="tab-daily-content">
          <div class="card-body py-3">
            <div class="search-bar" style="max-width:280px">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" id="attSearch" placeholder="Search employee…">
            </div>
          </div>
          <div class="table-wrapper">
            <table class="table table-hover mb-0">
              <thead><tr><th>Employee</th><th>Department</th><th>Date</th><th>Check In</th><th>Check Out</th><th>Hours</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody id="attTable"></tbody>
            </table>
          </div>
        </div>
        <div id="tab-leaves-content" class="d-none">
          <div class="card-body">
            <div class="d-flex justify-content-end mb-3">
              <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#leaveModal"><i class="bi bi-plus me-1"></i>Apply Leave</button>
            </div>
            <div class="table-wrapper">
              <table class="table table-hover mb-0">
                <thead><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="leaveTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Attendance Modal -->
<div class="modal fade" id="attModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h6 class="modal-title">Mark Attendance</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label">Employee</label><select class="form-select" id="attEmployee"></select></div>
      <div class="mb-3"><label class="form-label">Date</label><input type="date" class="form-control" id="attDateInp"></div>
      <div class="row g-2">
        <div class="col-6"><label class="form-label">Check In</label><input type="time" class="form-control" id="attCheckIn"></div>
        <div class="col-6"><label class="form-label">Check Out</label><input type="time" class="form-control" id="attCheckOut"></div>
      </div>
      <div class="mt-3"><label class="form-label">Status</label>
        <select class="form-select" id="attStatus">
          <option value="Present">Present</option><option value="Absent">Absent</option><option value="Late">Late</option><option value="Half Day">Half Day</option>
        </select>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="saveAttBtn">Save</button></div>
  </div></div>
</div>

<!-- Leave Modal -->
<div class="modal fade" id="leaveModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h6 class="modal-title">Apply for Leave</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label">Employee</label><select class="form-select" id="leaveEmployee"></select></div>
      <div class="mb-3"><label class="form-label">Leave Type</label>
        <select class="form-select" id="leaveType"><option>Sick Leave</option><option>Annual Leave</option><option>Casual Leave</option><option>Maternity Leave</option><option>Unpaid Leave</option></select>
      </div>
      <div class="row g-2 mb-3">
        <div class="col-6"><label class="form-label">From Date</label><input type="date" class="form-control" id="leaveFrom"></div>
        <div class="col-6"><label class="form-label">To Date</label><input type="date" class="form-control" id="leaveTo"></div>
      </div>
      <div class="mb-3"><label class="form-label">Reason</label><textarea class="form-control" id="leaveReason" rows="3" placeholder="Reason for leave…"></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="saveLeaveBtn">Submit</button></div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
(function() {
  const { Storage, Session } = window.E360;
  const { showToast, genId, formatDate, formatDateTime, timeAgo, today, formatCurrency, getInitials, avatarColor, avatarHtml, statusBadge, priorityBadge, debounce, throttle, confirm, paginate, renderPagination, searchFilter, sortBy, exportCSV, previewImage, fetchData, skeletonRow, showLoading } = window.E360.Utils;
  const { Auth, getSampleData } = window.E360;
  const { initPage, renderSidebar, renderTopbar } = window.E360.App;


  let attendance=[], leaves=[], employees=[];

  async function init() {
    const user = await initPage('Attendance', 'attendance.html');
    if (!user) return;
    const data = await getSampleData();
    attendance = Storage.get('attendance', data.attendance);
    leaves     = Storage.get('leaves', data.leaves);
    employees  = Storage.get('employees', data.employees);

    const today = new Date().toISOString().split('T')[0];
    document.getElementById('attDate').value = today;
    document.getElementById('attDateInp').value = today;

    populateEmployeeSelects();
    renderStats();
    renderAttendance();
    renderLeaves();

    // Tabs
    document.querySelectorAll('[data-tab]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('[data-tab]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('tab-daily-content').classList.toggle('d-none', btn.dataset.tab !== 'daily');
        document.getElementById('tab-leaves-content').classList.toggle('d-none', btn.dataset.tab !== 'leaves');
      });
    });

    document.getElementById('empSearch')?.addEventListener('input', debounce(renderAttendance, 300));
    document.getElementById('attDate').addEventListener('change', renderAttendance);
    document.getElementById('saveAttBtn').addEventListener('click', saveAttendance);
    document.getElementById('saveLeaveBtn').addEventListener('click', saveLeave);
  }

  function populateEmployeeSelects() {
    ['attEmployee','leaveEmployee'].forEach(id => {
      const sel = document.getElementById(id);
      sel.innerHTML = '';
      employees.forEach(e => { const o = document.createElement('option'); o.value=e.id; o.textContent=e.name; sel.appendChild(o); });
    });
  }

  function renderStats() {
    const today = document.getElementById('attDate').value || new Date().toISOString().split('T')[0];
    const todayRec = attendance.filter(a => a.date === today);
    const present = todayRec.filter(a => a.status==='Present').length;
    const absent  = todayRec.filter(a => a.status==='Absent').length;
    const late    = todayRec.filter(a => a.status==='Late').length;
    document.getElementById('attStats').innerHTML = [
      { label:'Present Today', value:present, icon:'bi-person-check', bg:'bg-success-soft' },
      { label:'Absent Today', value:absent, icon:'bi-person-x', bg:'bg-danger-soft' },
      { label:'Late Arrivals', value:late, icon:'bi-clock-history', bg:'bg-warning-soft' },
      { label:'Pending Leaves', value:leaves.filter(l=>l.status==='Pending').length, icon:'bi-calendar-x', bg:'bg-info-soft' },
    ].map(s=>`<div class="col-sm-6 col-lg-3"><div class="stat-card"><div class="stat-icon ${s.bg}"><i class="bi ${s.icon}"></i></div><div class="stat-info"><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div></div></div>`).join('');
  }

  function renderAttendance() {
    const selDate = document.getElementById('attDate').value;
    const q = document.getElementById('attSearch')?.value || '';
    let list = selDate ? attendance.filter(a => a.date === selDate) : attendance;
    if (q) list = searchFilter(list, q, ['employeeName']);
    const statusClass = { Present:'badge-present', Absent:'badge-inactive', Late:'badge-late', 'Half Day':'badge-pending' };
    document.getElementById('attTable').innerHTML = list.length ? list.map(a => {
      const hrs = a.checkIn && a.checkOut ? calcHours(a.checkIn, a.checkOut) : '—';
      return `<tr>
        <td><div class="fw-semibold" style="font-size:.85rem">${a.employeeName}</div></td>
        <td style="font-size:.82rem">${employees.find(e=>e.id===a.employeeId)?.department||'—'}</td>
        <td style="font-size:.82rem">${formatDate(a.date)}</td>
        <td style="font-size:.82rem">${a.checkIn||'—'}</td>
        <td style="font-size:.82rem">${a.checkOut||'—'}</td>
        <td style="font-size:.82rem">${hrs}</td>
        <td><span class="badge-status ${statusClass[a.status]||'badge-pending'}">${a.status}</span></td>
        <td><button class="btn-icon text-danger del-att" data-id="${a.id}" title="Delete"><i class="bi bi-trash"></i></button></td>
      </tr>`;
    }).join('') : `<tr><td colspan="8"><div class="empty-state"><i class="bi bi-calendar"></i><h6>No attendance records</h6></div></td></tr>`;
    document.querySelectorAll('.del-att').forEach(b => b.addEventListener('click', () => {
      attendance = attendance.filter(a => a.id !== +b.dataset.id);
      Storage.set('attendance', attendance);
      renderAttendance(); renderStats();
    }));
  }

  function renderLeaves() {
    const statusClass = { Pending:'badge-pending', Approved:'badge-approved', Rejected:'badge-rejected' };
    document.getElementById('leaveTable').innerHTML = leaves.length ? leaves.map(l => `
      <tr>
        <td style="font-size:.85rem;font-weight:600">${l.employeeName}</td>
        <td style="font-size:.82rem">${l.type}</td>
        <td style="font-size:.82rem">${formatDate(l.from)}</td>
        <td style="font-size:.82rem">${formatDate(l.to)}</td>
        <td style="font-size:.82rem">${l.days}</td>
        <td style="font-size:.82rem">${l.reason}</td>
        <td><span class="badge-status ${statusClass[l.status]||'badge-pending'}">${l.status}</span></td>
        <td><div class="d-flex gap-1">
          ${l.status==='Pending' ? `
            <button class="btn btn-sm btn-outline-success approve-leave" data-id="${l.id}" title="Approve"><i class="bi bi-check-lg"></i></button>
            <button class="btn btn-sm btn-outline-danger reject-leave" data-id="${l.id}" title="Reject"><i class="bi bi-x-lg"></i></button>` : ''}
        </div></td>
      </tr>`).join('') : `<tr><td colspan="8"><div class="empty-state"><i class="bi bi-calendar-x"></i><h6>No leave requests</h6></div></td></tr>`;
    document.querySelectorAll('.approve-leave').forEach(b => b.addEventListener('click', () => updateLeave(+b.dataset.id, 'Approved')));
    document.querySelectorAll('.reject-leave').forEach(b => b.addEventListener('click', () => updateLeave(+b.dataset.id, 'Rejected')));
  }

  function updateLeave(id, status) {
    const idx = leaves.findIndex(l => l.id === id);
    if (idx !== -1) { leaves[idx].status = status; Storage.set('leaves', leaves); renderLeaves(); showToast(`Leave ${status.toLowerCase()}!`, status==='Approved'?'success':'danger'); }
  }

  function calcHours(inT, outT) {
    const [ih,im] = inT.split(':').map(Number); const [oh,om] = outT.split(':').map(Number);
    const diff = (oh*60+om) - (ih*60+im);
    if (diff <= 0) return '—';
    return `${Math.floor(diff/60)}h ${diff%60}m`;
  }

  function saveAttendance() {
    const empId = +document.getElementById('attEmployee').value;
    const date  = document.getElementById('attDateInp').value;
    const emp   = employees.find(e => e.id === empId);
    const rec = { id:genId(), employeeId:empId, employeeName:emp?.name||'Unknown', date, checkIn:document.getElementById('attCheckIn').value, checkOut:document.getElementById('attCheckOut').value, status:document.getElementById('attStatus').value };
    attendance.push(rec);
    Storage.set('attendance', attendance);
    bootstrap.Modal.getInstance(document.getElementById('attModal')).hide();
    renderAttendance(); renderStats();
    showToast('Attendance marked!', 'success');
  }

  function saveLeave() {
    const empId = +document.getElementById('leaveEmployee').value;
    const emp   = employees.find(e => e.id === empId);
    const from  = document.getElementById('leaveFrom').value;
    const to    = document.getElementById('leaveTo').value;
    if (!from || !to) { showToast('Please select dates.', 'warning'); return; }
    const days  = Math.ceil((new Date(to)-new Date(from))/(1000*60*60*24)) + 1;
    leaves.push({ id:genId(), employeeId:empId, employeeName:emp?.name||'Unknown', type:document.getElementById('leaveType').value, from, to, days, reason:document.getElementById('leaveReason').value, status:'Pending' });
    Storage.set('leaves', leaves);
    bootstrap.Modal.getInstance(document.getElementById('leaveModal')).hide();
    renderLeaves(); renderStats();
    showToast('Leave application submitted!', 'success');
  }

  init();

})();
</script>
</body>
</html>
