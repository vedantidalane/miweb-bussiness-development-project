<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Attendance – Enterprise360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="toast-container"></div>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div><h5 class="mb-1 fw-bold">Attendance Management</h5><p class="text-muted mb-0" style="font-size:.85rem">Track daily attendance</p></div>
        <div class="d-flex gap-2">
          <input type="date" class="form-control" id="attDate" style="width:160px">
          <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#attModal"><i class="bi bi-plus-lg me-2"></i>Mark Attendance</button>
        </div>
      </div>

      <div class="row g-3 mb-4" id="attStats"></div>

      <!-- Tabs -->
      <div class="card">
        <div class="card-header">
          <ul class="nav nav-tabs card-header-tabs">
            <li class="nav-item"><button class="nav-link active" id="tab-daily" data-tab="daily">Daily View</button></li>
            <li class="nav-item"><button class="nav-link" id="tab-leaves" data-tab="leaves">Leave Requests</button></li>
          </ul>
        </div>
        <div id="tab-daily-content">
          <div class="card-body py-3">
            <div class="search-bar" style="max-width:280px">
              <i class="bi bi-search"></i>
              <input type="text" class="form-control" id="attSearch" placeholder="Search employee…">
            </div>
          </div>
          <div class="table-wrapper">
            <table class="table table-hover mb-0">
              <thead><tr><th>Employee</th><th>Department</th><th>Date</th><th>Check In</th><th>Check Out</th><th>Hours</th><th>Status</th><th>Actions</th></tr></thead>
              <tbody id="attTable"></tbody>
            </table>
          </div>
        </div>
        <div id="tab-leaves-content" class="d-none">
          <div class="card-body">
            <div class="d-flex justify-content-end mb-3">
              <button class="btn btn-primary btn-sm" data-bs-toggle="modal" data-bs-target="#leaveModal"><i class="bi bi-plus me-1"></i>Apply Leave</button>
            </div>
            <div class="table-wrapper">
              <table class="table table-hover mb-0">
                <thead><tr><th>Employee</th><th>Type</th><th>From</th><th>To</th><th>Days</th><th>Reason</th><th>Status</th><th>Actions</th></tr></thead>
                <tbody id="leaveTable"></tbody>
              </table>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Attendance Modal -->
<div class="modal fade" id="attModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h6 class="modal-title">Mark Attendance</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label">Employee</label><select class="form-select" id="attEmployee"></select></div>
      <div class="mb-3"><label class="form-label">Date</label><input type="date" class="form-control" id="attDateInp"></div>
      <div class="row g-2">
        <div class="col-6"><label class="form-label">Check In</label><input type="time" class="form-control" id="attCheckIn"></div>
        <div class="col-6"><label class="form-label">Check Out</label><input type="time" class="form-control" id="attCheckOut"></div>
      </div>
      <div class="mt-3"><label class="form-label">Status</label>
        <select class="form-select" id="attStatus">
          <option value="Present">Present</option><option value="Absent">Absent</option><option value="Late">Late</option><option value="Half Day">Half Day</option>
        </select>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="saveAttBtn">Save</button></div>
  </div></div>
</div>

<!-- Leave Modal -->
<div class="modal fade" id="leaveModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h6 class="modal-title">Apply for Leave</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="mb-3"><label class="form-label">Employee</label><select class="form-select" id="leaveEmployee"></select></div>
      <div class="mb-3"><label class="form-label">Leave Type</label>
        <select class="form-select" id="leaveType"><option>Sick Leave</option><option>Annual Leave</option><option>Casual Leave</option><option>Maternity Leave</option><option>Unpaid Leave</option></select>
      </div>
      <div class="row g-2 mb-3">
        <div class="col-6"><label class="form-label">From Date</label><input type="date" class="form-control" id="leaveFrom"></div>
        <div class="col-6"><label class="form-label">To Date</label><input type="date" class="form-control" id="leaveTo"></div>
      </div>
      <div class="mb-3"><label class="form-label">Reason</label><textarea class="form-control" id="leaveReason" rows="3" placeholder="Reason for leave…"></textarea></div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="saveLeaveBtn">Submit</button></div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/attendance.js"></script>
</body>
</html>
