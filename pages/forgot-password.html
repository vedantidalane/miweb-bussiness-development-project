<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Forgot Password – Enterprise360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div class="login-page">
  <div class="login-card">
    <div class="login-logo" style="background:#f59e0b"><i class="bi bi-key text-white"></i></div>
    <h4 class="text-center fw-bold mb-1">Forgot Password?</h4>
    <p class="text-center text-muted mb-4" style="font-size:.88rem">Enter your email to reset your password</p>
    <div id="successMsg" class="alert alert-success d-none">
      <i class="bi bi-check-circle me-2"></i>
      If this email is registered, a reset link has been sent. (Demo – check console)
    </div>
    <form id="forgotForm">
      <div class="mb-4">
        <label class="form-label">Email Address</label>
        <div class="input-group">
          <span class="input-group-text"><i class="bi bi-envelope"></i></span>
          <input type="email" id="email" class="form-control" placeholder="email@company.com" required>
        </div>
      </div>
      <button type="submit" class="btn btn-warning w-100 py-2 text-dark fw-semibold">
        <i class="bi bi-send me-2"></i>Send Reset Link
      </button>
    </form>
    <p class="text-center mt-4 mb-0" style="font-size:.82rem">
      <a href="login.html" class="text-primary text-decoration-none"><i class="bi bi-arrow-left me-1"></i>Back to Login</a>
    </p>
  </div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script>
  const theme = localStorage.getItem('e360_theme') || 'light';
  document.documentElement.setAttribute('data-theme', theme);

  document.getElementById('forgotForm').addEventListener('submit', async e => {
    e.preventDefault();
    const email = document.getElementById('email').value;
    console.log('[Demo] Password reset requested for:', email);
    await new Promise(r => setTimeout(r, 400));
    document.getElementById('successMsg').classList.remove('d-none');
    document.getElementById('forgotForm').style.display = 'none';
  });
</script>
</body>
</html>
