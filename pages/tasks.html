<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tasks & Kanban – Enterprise360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="toast-container"></div>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
          <h5 class="mb-1 fw-bold">Task Management & Kanban</h5>
          <p class="text-muted mb-0" style="font-size:.85rem">Drag & drop tasks across workflow stages with SortableJS</p>
        </div>
        <button class="btn btn-primary" id="addTaskBtn"><i class="bi bi-plus-lg me-2"></i>Add Task</button>
      </div>

      <div class="row g-3 mb-4" id="taskStats"></div>

      <!-- Project & Priority filters -->
      <div class="card mb-3 shadow-sm">
        <div class="card-body py-3">
          <div class="row g-2 align-items-center">
            <div class="col-sm-4">
              <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" class="form-control" id="taskSearch" placeholder="Search tasks by title, assignee…">
              </div>
            </div>
            <div class="col-sm-4">
              <select class="form-select" id="projFilter"></select>
            </div>
            <div class="col-sm-4">
              <select class="form-select" id="priorityFilter">
                <option value="">All Priorities</option>
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Kanban Board -->
      <div class="kanban-board" id="kanbanBoard"></div>

    </main>
  </div>
</div>

<!-- Task Modal -->
<div class="modal fade" id="taskModal" tabindex="-1">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="taskModalTitle">Add Task</h6>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Task Title *</label>
            <input type="text" class="form-control" id="taskTitle" placeholder="e.g. Design Landing Page Mockups" required>
          </div>
          <div class="col-12">
            <label class="form-label">Project</label>
            <select class="form-select" id="taskProject"></select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Assignee</label>
            <select class="form-select" id="taskAssignee"></select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Priority</label>
            <select class="form-select" id="taskPriority">
              <option>High</option>
              <option>Medium</option>
              <option>Low</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Due Date</label>
            <input type="date" class="form-control" id="taskDue">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Status</label>
            <select class="form-select" id="taskStatus">
              <option value="Todo">To Do</option>
              <option value="In Progress">In Progress</option>
              <option value="Done">Done</option>
            </select>
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="taskDesc" rows="3" placeholder="Task requirements and scope…"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveTaskBtn"><i class="bi bi-check-lg me-1"></i>Save Task</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
(function() {
  const { Storage } = window.E360;
  const { showToast, genId, formatDate, confirm, searchFilter, debounce } = window.E360.Utils;
  const { getSampleData } = window.E360;

  let tasks = [];
  let projects = [];
  let employees = [];
  let editTaskId = null;
  let taskModal;
  let sortableInstances = [];

  const COLS = [
    { id: 'Todo', label: 'To Do', color: '#3b82f6' },
    { id: 'In Progress', label: 'In Progress', color: '#f59e0b' },
    { id: 'Done', label: 'Done', color: '#10b981' }
  ];

  async function init() {
    const user = await window.initPage('Tasks', 'tasks.html');
    if (!user) return;

    const data = await getSampleData();
    tasks = Storage.get('tasks', data.tasks || []);
    projects = Storage.get('projects', data.projects || []);
    employees = Storage.get('employees', data.employees || []);
    taskModal = new bootstrap.Modal(document.getElementById('taskModal'));

    populateSelects();
    renderStats();
    renderBoard();

    document.getElementById('addTaskBtn')?.addEventListener('click', openAdd);
    document.getElementById('saveTaskBtn')?.addEventListener('click', save);
    document.getElementById('taskSearch')?.addEventListener('input', debounce(renderBoard, 300));
    document.getElementById('projFilter')?.addEventListener('change', renderBoard);
    document.getElementById('priorityFilter')?.addEventListener('change', renderBoard);
  }

  function populateSelects() {
    const pf = document.getElementById('projFilter');
    if (pf) {
      pf.innerHTML = '<option value="">All Projects</option>';
      projects.forEach(p => {
        const o = document.createElement('option');
        o.value = p.id;
        o.textContent = p.name;
        pf.appendChild(o);
      });
    }

    const tp = document.getElementById('taskProject');
    if (tp) {
      tp.innerHTML = '';
      projects.forEach(p => {
        const o = document.createElement('option');
        o.value = p.id;
        o.textContent = p.name;
        tp.appendChild(o);
      });
    }

    const ta = document.getElementById('taskAssignee');
    if (ta) {
      ta.innerHTML = '';
      employees.forEach(e => {
        const o = document.createElement('option');
        o.value = e.name;
        o.textContent = `${e.name} (${e.department})`;
        ta.appendChild(o);
      });
    }
  }

  function renderStats() {
    const todo = tasks.filter(t => t.status === 'Todo').length;
    const prog = tasks.filter(t => t.status === 'In Progress').length;
    const done = tasks.filter(t => t.status === 'Done').length;
    const high = tasks.filter(t => t.priority === 'High' && t.status !== 'Done').length;

    const statEl = document.getElementById('taskStats');
    if (statEl) {
      statEl.innerHTML = [
        { label: 'To Do', value: todo, icon: 'bi-circle', bg: 'bg-info-soft' },
        { label: 'In Progress', value: prog, icon: 'bi-play-circle', bg: 'bg-warning-soft' },
        { label: 'Completed', value: done, icon: 'bi-check-circle', bg: 'bg-success-soft' },
        { label: 'High Priority', value: high, icon: 'bi-exclamation-circle', bg: 'bg-danger-soft' },
      ].map(s => `
        <div class="col-sm-6 col-lg-3">
          <div class="stat-card">
            <div class="stat-icon ${s.bg}"><i class="bi ${s.icon}"></i></div>
            <div class="stat-info">
              <div class="stat-value">${s.value}</div>
              <div class="stat-label">${s.label}</div>
            </div>
          </div>
        </div>`).join('');
    }
  }

  function getFiltered() {
    let list = [...tasks];
    const q = document.getElementById('taskSearch')?.value.trim().toLowerCase() || '';
    const pf = document.getElementById('projFilter')?.value || '';
    const pr = document.getElementById('priorityFilter')?.value || '';

    if (q) list = list.filter(t => t.title.toLowerCase().includes(q) || (t.assignee && t.assignee.toLowerCase().includes(q)));
    if (pf) list = list.filter(t => t.projectId === +pf);
    if (pr) list = list.filter(t => t.priority === pr);
    return list;
  }

  function renderBoard() {
    const filtered = getFiltered();
    const pColors = { High: 'danger', Medium: 'warning', Low: 'success' };

    // Clean up existing Sortable instances
    sortableInstances.forEach(s => s.destroy());
    sortableInstances = [];

    const board = document.getElementById('kanbanBoard');
    if (!board) return;

    board.innerHTML = COLS.map(col => {
      const colTasks = filtered.filter(t => t.status === col.id);
      return `
        <div class="kanban-col" data-col="${col.id}">
          <div class="kanban-col-header">
            <div class="d-flex align-items-center gap-2">
              <span style="width:10px;height:10px;border-radius:50%;background:${col.color};display:inline-block"></span>
              ${col.label}
            </div>
            <span class="badge" style="background:${col.color}25;color:${col.color}">${colTasks.length}</span>
          </div>
          <div class="kanban-cards" id="sortable-col-${col.id.replace(/\s+/g, '-')}" style="min-height: 180px;">
            ${colTasks.map(t => taskCard(t, pColors)).join('')}
          </div>
        </div>`;
    }).join('');

    // Attach SortableJS to each column container
    COLS.forEach(col => {
      const colEl = document.getElementById(`sortable-col-${col.id.replace(/\s+/g, '-')}`);
      if (colEl && typeof Sortable !== 'undefined') {
        const instance = new Sortable(colEl, {
          group: 'kanban-group',
          animation: 180,
          ghostClass: 'dragging',
          onEnd: function(evt) {
            const taskId = +evt.item.dataset.id;
            const newColId = evt.to.closest('.kanban-col')?.dataset.col;
            if (newColId && taskId) {
              const taskIndex = tasks.findIndex(t => t.id === taskId);
              if (taskIndex !== -1 && tasks[taskIndex].status !== newColId) {
                tasks[taskIndex].status = newColId;
                Storage.set('tasks', tasks);
                renderStats();
                showToast(`Task moved to "${newColId}"`, 'info');
              }
            }
          }
        });
        sortableInstances.push(instance);
      }
    });

    // Edit and Delete buttons
    document.querySelectorAll('.edit-task').forEach(b => {
      b.addEventListener('click', e => {
        e.stopPropagation();
        openEdit(+b.dataset.id);
      });
    });

    document.querySelectorAll('.del-task').forEach(b => {
      b.addEventListener('click', async e => {
        e.stopPropagation();
        await delTask(+b.dataset.id);
      });
    });
  }

  function taskCard(t, pColors) {
    const proj = projects.find(p => p.id === t.projectId);
    return `
      <div class="kanban-card" data-id="${t.id}">
        <div class="d-flex justify-content-between align-items-start mb-2">
          <span class="badge bg-${pColors[t.priority] || 'secondary'} bg-opacity-15 text-${pColors[t.priority] || 'secondary'}" style="font-size:.7rem">${t.priority}</span>
          <div class="d-flex gap-1">
            <button class="btn-icon edit-task" data-id="${t.id}" style="width:24px;height:24px;font-size:.8rem" title="Edit"><i class="bi bi-pencil"></i></button>
            <button class="btn-icon del-task text-danger" data-id="${t.id}" style="width:24px;height:24px;font-size:.8rem" title="Delete"><i class="bi bi-trash"></i></button>
          </div>
        </div>
        <div class="fw-semibold mb-1" style="font-size:.85rem">${t.title}</div>
        ${t.description ? `<div class="text-muted mb-2" style="font-size:.75rem">${t.description.substring(0, 80)}${t.description.length > 80 ? '…' : ''}</div>` : ''}
        <div class="d-flex justify-content-between align-items-center mt-2 border-top pt-2">
          <div style="font-size:.72rem;color:var(--text-muted)">${proj ? proj.name : 'No Project'}</div>
          <div class="d-flex align-items-center gap-1" style="font-size:.72rem;color:var(--text-muted)">
            <i class="bi bi-calendar"></i>${formatDate(t.dueDate)}
          </div>
        </div>
        <div class="text-muted mt-1" style="font-size:.72rem"><i class="bi bi-person me-1"></i>${t.assignee || 'Unassigned'}</div>
      </div>`;
  }

  function openAdd() {
    editTaskId = null;
    document.getElementById('taskModalTitle').textContent = 'Add Task';
    document.getElementById('taskTitle').value = '';
    document.getElementById('taskDesc').value = '';
    document.getElementById('taskProject').selectedIndex = 0;
    document.getElementById('taskAssignee').selectedIndex = 0;
    document.getElementById('taskPriority').value = 'Medium';
    document.getElementById('taskStatus').value = 'Todo';
    document.getElementById('taskDue').value = '';
    taskModal.show();
  }

  function openEdit(id) {
    editTaskId = id;
    const t = tasks.find(t => t.id === id);
    if (!t) return;

    document.getElementById('taskModalTitle').textContent = 'Edit Task';
    document.getElementById('taskTitle').value = t.title;
    document.getElementById('taskProject').value = t.projectId;
    document.getElementById('taskAssignee').value = t.assignee || '';
    document.getElementById('taskPriority').value = t.priority;
    document.getElementById('taskStatus').value = t.status;
    document.getElementById('taskDue').value = t.dueDate || '';
    document.getElementById('taskDesc').value = t.description || '';
    taskModal.show();
  }

  async function delTask(id) {
    const ok = await confirm('Delete this task?', 'Delete Task');
    if (!ok) return;

    tasks = tasks.filter(t => t.id !== id);
    Storage.set('tasks', tasks);
    renderStats();
    renderBoard();
    showToast('Task deleted successfully.', 'danger');
  }

  function save() {
    const title = document.getElementById('taskTitle').value.trim();
    if (!title) {
      showToast('Task title is required.', 'warning');
      return;
    }

    const task = {
      id: editTaskId || genId(),
      title,
      projectId: +document.getElementById('taskProject').value,
      assignee: document.getElementById('taskAssignee').value,
      priority: document.getElementById('taskPriority').value,
      status: document.getElementById('taskStatus').value,
      dueDate: document.getElementById('taskDue').value,
      description: document.getElementById('taskDesc').value.trim(),
    };

    if (editTaskId) {
      const idx = tasks.findIndex(t => t.id === editTaskId);
      if (idx !== -1) tasks[idx] = { ...tasks[idx], ...task };
    } else {
      tasks.push(task);
    }

    Storage.set('tasks', tasks);
    taskModal.hide();
    renderStats();
    renderBoard();
    showToast(editTaskId ? 'Task updated successfully!' : 'Task added successfully!', 'success');
  }

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
