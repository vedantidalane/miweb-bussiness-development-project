<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Employees – Enterprise360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-container"></div>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">

      <!-- Header -->
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
          <h5 class="mb-1 fw-bold">Employee Management</h5>
          <p class="text-muted mb-0" style="font-size:.85rem">Manage your team members</p>
        </div>
        <button class="btn btn-primary" id="addEmpBtn"><i class="bi bi-plus-lg me-2"></i>Add Employee</button>
      </div>

      <!-- Stats -->
      <div class="row g-3 mb-4" id="empStats"></div>

      <!-- Filters -->
      <div class="card mb-3">
        <div class="card-body py-3">
          <div class="row g-2 align-items-center">
            <div class="col-sm-5 col-lg-4">
              <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" class="form-control" id="empSearch" placeholder="Search employees…">
              </div>
            </div>
            <div class="col-sm-3 col-lg-2">
              <select class="form-select" id="deptFilter"><option value="">All Departments</option></select>
            </div>
            <div class="col-sm-3 col-lg-2">
              <select class="form-select" id="statusFilter">
                <option value="">All Status</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
            </div>
            <div class="col-sm-3 col-lg-2">
              <select class="form-select" id="sortSelect">
                <option value="name">Sort: Name</option>
                <option value="joinDate">Sort: Join Date</option>
                <option value="salary">Sort: Salary</option>
                <option value="department">Sort: Department</option>
              </select>
            </div>
            <div class="col-auto ms-auto">
              <button class="btn btn-outline-secondary btn-sm" id="exportEmpBtn"><i class="bi bi-download me-1"></i>Export</button>
            </div>
          </div>
        </div>
      </div>

      <!-- Table / Grid toggle -->
      <div class="card">
        <div class="card-header">
          <span class="card-title" id="empCount">Employees</span>
          <div class="d-flex gap-2 align-items-center">
            <div class="btn-group btn-group-sm" role="group">
              <button class="btn btn-outline-secondary active" id="tableView" title="Table View"><i class="bi bi-table"></i></button>
              <button class="btn btn-outline-secondary" id="gridView" title="Grid View"><i class="bi bi-grid-3x3-gap"></i></button>
            </div>
          </div>
        </div>
        <!-- Table -->
        <div id="tableContainer" class="table-wrapper">
          <table class="table table-hover mb-0">
            <thead><tr>
              <th>Employee</th><th>Department</th><th>Designation</th>
              <th>Phone</th><th>Join Date</th><th>Salary</th><th>Status</th><th>Actions</th>
            </tr></thead>
            <tbody id="empTableBody"></tbody>
          </table>
        </div>
        <!-- Grid -->
        <div id="gridContainer" class="card-body d-none">
          <div class="row g-3" id="empGrid"></div>
        </div>
        <!-- Pagination -->
        <div class="card-body border-top d-flex justify-content-between align-items-center py-2 flex-wrap gap-2">
          <div class="text-muted" style="font-size:.82rem" id="pageInfo"></div>
          <div id="pagination"></div>
        </div>
      </div>

    </main>
  </div>
</div>

<!-- Add/Edit Modal -->
<div class="modal fade" id="empModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="empModalTitle">Add Employee</h6>
        <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="text-center mb-3">
          <div class="avatar-upload-wrap d-inline-block" onclick="document.getElementById('avatarInput').click()">
            <div class="avatar avatar-xl mx-auto" id="avatarPreview" style="background:#4f46e5">AV</div>
            <div class="avatar-overlay"><i class="bi bi-camera"></i></div>
          </div>
          <input type="file" id="avatarInput" accept="image/*" class="d-none">
          <p class="text-muted mt-2 mb-0" style="font-size:.78rem">Click to upload photo</p>
        </div>
        <div class="row g-3">
          <div class="col-sm-6"><label class="form-label">Full Name *</label><input type="text" class="form-control" id="empName" required></div>
          <div class="col-sm-6"><label class="form-label">Email *</label><input type="email" class="form-control" id="empEmail" required></div>
          <div class="col-sm-6"><label class="form-label">Phone</label><input type="text" class="form-control" id="empPhone" placeholder="+1-555-0000"></div>
          <div class="col-sm-6"><label class="form-label">Department *</label><select class="form-select" id="empDept"></select></div>
          <div class="col-sm-6"><label class="form-label">Designation *</label><select class="form-select" id="empDesig"></select></div>
          <div class="col-sm-6"><label class="form-label">Salary (USD)</label><input type="number" class="form-control" id="empSalary" placeholder="60000"></div>
          <div class="col-sm-6"><label class="form-label">Join Date</label><input type="date" class="form-control" id="empJoinDate"></div>
          <div class="col-sm-6"><label class="form-label">Status</label>
            <select class="form-select" id="empStatus"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveEmpBtn"><i class="bi bi-check-lg me-2"></i>Save Employee</button>
      </div>
    </div>
  </div>
</div>

<!-- View Profile Modal -->
<div class="modal fade" id="profileModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header"><h6 class="modal-title">Employee Profile</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
      <div class="modal-body" id="profileBody"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/employees.js"></script>
</body>
</html>
