<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects – Enterprise360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.css">
  <link rel="stylesheet" href="../css/style.css">
  <link rel="stylesheet" href="../css/dashboard.css">
  <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>
<div id="toast-container"></div>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div>
          <h5 class="mb-1 fw-bold">Project Management</h5>
          <p class="text-muted mb-0" style="font-size:.85rem">Manage enterprise projects, team milestones, and timelines</p>
        </div>
        <div class="d-flex gap-2">
          <div class="btn-group btn-group-sm" role="group">
            <button class="btn btn-outline-secondary active" id="viewCardsBtn"><i class="bi bi-grid-3x3-gap me-1"></i>Cards</button>
            <button class="btn btn-outline-secondary" id="viewCalBtn"><i class="bi bi-calendar3 me-1"></i>Calendar</button>
          </div>
          <button class="btn btn-primary btn-sm" id="addProjBtn"><i class="bi bi-plus-lg me-1"></i>New Project</button>
        </div>
      </div>

      <div class="row g-3 mb-4" id="projStats"></div>

      <!-- Filters -->
      <div class="card mb-3 shadow-sm">
        <div class="card-body py-3">
          <div class="row g-2 align-items-center">
            <div class="col-sm-5">
              <div class="search-bar">
                <i class="bi bi-search"></i>
                <input type="text" class="form-control" id="projSearch" placeholder="Search projects by name, client, manager…">
              </div>
            </div>
            <div class="col-sm-3">
              <select class="form-select" id="projStatusFilter">
                <option value="">All Statuses</option>
                <option>Planning</option>
                <option>In Progress</option>
                <option>Completed</option>
              </select>
            </div>
            <div class="col-sm-3">
              <select class="form-select" id="projPriorityFilter">
                <option value="">All Priorities</option>
                <option>High</option>
                <option>Medium</option>
                <option>Low</option>
              </select>
            </div>
          </div>
        </div>
      </div>

      <!-- Projects Grid -->
      <div class="row g-3" id="projGrid"></div>

      <!-- FullCalendar View Container -->
      <div id="calendarContainer" class="card shadow-sm p-3 d-none">
        <div id="fullCalendarEl" style="min-height: 600px;"></div>
      </div>

    </main>
  </div>
</div>

<!-- Project Modal -->
<div class="modal fade" id="projModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable">
    <div class="modal-content">
      <div class="modal-header">
        <h6 class="modal-title" id="projModalTitle">New Project</h6>
        <button class="btn-close" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <div class="row g-3">
          <div class="col-12">
            <label class="form-label">Project Name *</label>
            <input type="text" class="form-control" id="projName" placeholder="e.g. AI Operations Dashboard" required>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Client / Department</label>
            <input type="text" class="form-control" id="projClient" placeholder="e.g. Acme Corporation">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Project Manager</label>
            <select class="form-select" id="projManager"></select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Status</label>
            <select class="form-select" id="projStatus">
              <option>Planning</option>
              <option>In Progress</option>
              <option>Completed</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Priority</label>
            <select class="form-select" id="projPriority">
              <option>High</option>
              <option>Medium</option>
              <option>Low</option>
            </select>
          </div>
          <div class="col-sm-6">
            <label class="form-label">Start Date</label>
            <input type="date" class="form-control" id="projStart">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Due Date</label>
            <input type="date" class="form-control" id="projDue">
          </div>
          <div class="col-sm-6">
            <label class="form-label">Progress (%)</label>
            <input type="number" class="form-control" id="projProgress" min="0" max="100" value="0">
          </div>
          <div class="col-12">
            <label class="form-label">Description</label>
            <textarea class="form-control" id="projDesc" rows="3" placeholder="Overview of project objectives…"></textarea>
          </div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
        <button class="btn btn-primary" id="saveProjBtn"><i class="bi bi-check-lg me-1"></i>Save Project</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.10/index.global.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script src="../js/projects.js"></script>
</body>
</html>
