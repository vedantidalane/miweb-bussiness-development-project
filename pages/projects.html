<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Projects – Enterprise360</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../css/style.css">
</head>
<body>
<div id="toast-container"></div>
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<div class="app-wrapper">
  <aside id="sidebar" class="sidebar"></aside>
  <div class="main-content" id="mainContent">
    <header class="topbar" id="topbar"></header>
    <main class="page-content">
      <div class="d-flex align-items-center justify-content-between mb-4 flex-wrap gap-2">
        <div><h5 class="mb-1 fw-bold">Project Management</h5><p class="text-muted mb-0" style="font-size:.85rem">Manage projects and timelines</p></div>
        <button class="btn btn-primary" id="addProjBtn"><i class="bi bi-plus-lg me-2"></i>New Project</button>
      </div>

      <div class="row g-3 mb-4" id="projStats"></div>

      <!-- Filters -->
      <div class="card mb-3">
        <div class="card-body py-3">
          <div class="row g-2 align-items-center">
            <div class="col-sm-5"><div class="search-bar"><i class="bi bi-search"></i><input type="text" class="form-control" id="projSearch" placeholder="Search projects…"></div></div>
            <div class="col-sm-3"><select class="form-select" id="projStatusFilter"><option value="">All Status</option><option>Planning</option><option>In Progress</option><option>Completed</option></select></div>
            <div class="col-sm-3"><select class="form-select" id="projPriorityFilter"><option value="">All Priority</option><option>High</option><option>Medium</option><option>Low</option></select></div>
          </div>
        </div>
      </div>

      <!-- Projects Grid -->
      <div class="row g-3" id="projGrid"></div>

    </main>
  </div>
</div>

<!-- Project Modal -->
<div class="modal fade" id="projModal" tabindex="-1">
  <div class="modal-dialog modal-lg modal-dialog-scrollable"><div class="modal-content">
    <div class="modal-header"><h6 class="modal-title" id="projModalTitle">New Project</h6><button class="btn-close" data-bs-dismiss="modal"></button></div>
    <div class="modal-body">
      <div class="row g-3">
        <div class="col-12"><label class="form-label">Project Name *</label><input type="text" class="form-control" id="projName"></div>
        <div class="col-sm-6"><label class="form-label">Client</label><input type="text" class="form-control" id="projClient"></div>
        <div class="col-sm-6"><label class="form-label">Manager</label><input type="text" class="form-control" id="projManager"></div>
        <div class="col-sm-6"><label class="form-label">Status</label>
          <select class="form-select" id="projStatus"><option>Planning</option><option>In Progress</option><option>Completed</option></select></div>
        <div class="col-sm-6"><label class="form-label">Priority</label>
          <select class="form-select" id="projPriority"><option>High</option><option>Medium</option><option>Low</option></select></div>
        <div class="col-sm-6"><label class="form-label">Start Date</label><input type="date" class="form-control" id="projStart"></div>
        <div class="col-sm-6"><label class="form-label">Due Date</label><input type="date" class="form-control" id="projDue"></div>
        <div class="col-sm-6"><label class="form-label">Progress (%)</label><input type="number" class="form-control" id="projProgress" min="0" max="100" value="0"></div>
        <div class="col-12"><label class="form-label">Description</label><textarea class="form-control" id="projDesc" rows="3"></textarea></div>
      </div>
    </div>
    <div class="modal-footer"><button class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><button class="btn btn-primary" id="saveProjBtn">Save Project</button></div>
  </div></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="../js/data.js"></script>
<script src="../js/storage.js"></script>
<script src="../js/utils.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/app.js"></script>
<script>
(function() {
  const { Storage, Session } = window.E360;
  const { showToast, genId, formatDate, formatDateTime, timeAgo, today, formatCurrency, getInitials, avatarColor, avatarHtml, statusBadge, priorityBadge, debounce, throttle, confirm, paginate, renderPagination, searchFilter, sortBy, exportCSV, previewImage, fetchData, skeletonRow, showLoading } = window.E360.Utils;
  const { Auth, getSampleData } = window.E360;
  const { initPage, renderSidebar, renderTopbar } = window.E360.App;


  let projects=[]; let editId=null; let projModal;

  async function init() {
    const user = await initPage('Projects', 'projects.html');
    if (!user) return;
    const data = await getSampleData();
    projects = Storage.get('projects', data.projects);
    projModal = new bootstrap.Modal(document.getElementById('projModal'));

    renderStats(); renderProjects();
    document.getElementById('addProjBtn').addEventListener('click', openAdd);
    document.getElementById('saveProjBtn').addEventListener('click', save);
    document.getElementById('projSearch').addEventListener('input', debounce(renderProjects, 300));
    document.getElementById('projStatusFilter').addEventListener('change', renderProjects);
    document.getElementById('projPriorityFilter').addEventListener('change', renderProjects);
  }

  function renderStats() {
    const total = projects.length;
    const inProg = projects.filter(p=>p.status==='In Progress').length;
    const done   = projects.filter(p=>p.status==='Completed').length;
    const plan   = projects.filter(p=>p.status==='Planning').length;
    document.getElementById('projStats').innerHTML = [
      {label:'Total Projects',value:total,icon:'bi-kanban',bg:'bg-primary-soft'},
      {label:'In Progress',value:inProg,icon:'bi-play-circle',bg:'bg-info-soft'},
      {label:'Completed',value:done,icon:'bi-check-circle',bg:'bg-success-soft'},
      {label:'Planning',value:plan,icon:'bi-clipboard',bg:'bg-warning-soft'},
    ].map(s=>`<div class="col-sm-6 col-lg-3"><div class="stat-card"><div class="stat-icon ${s.bg}"><i class="bi ${s.icon}"></i></div><div class="stat-info"><div class="stat-value">${s.value}</div><div class="stat-label">${s.label}</div></div></div></div>`).join('');
  }

  function getFiltered() {
    let list = [...projects];
    const q = document.getElementById('projSearch').value;
    const st = document.getElementById('projStatusFilter').value;
    const pr = document.getElementById('projPriorityFilter').value;
    if (q) list = searchFilter(list, q, ['name','client','manager']);
    if (st) list = list.filter(p => p.status === st);
    if (pr) list = list.filter(p => p.priority === pr);
    return list;
  }

  function renderProjects() {
    const filtered = getFiltered();
    const statusColors = { Planning:'warning', 'In Progress':'primary', Completed:'success' };
    const priorityColors = { High:'danger', Medium:'warning', Low:'success' };
    document.getElementById('projGrid').innerHTML = filtered.length ? filtered.map(p => `
      <div class="col-sm-6 col-xl-4">
        <div class="card h-100">
          <div class="card-body">
            <div class="d-flex justify-content-between mb-2">
              <span class="badge bg-${statusColors[p.status]||'secondary'} bg-opacity-15 text-${statusColors[p.status]||'secondary'}" style="font-size:.72rem">${p.status}</span>
              <span class="badge bg-${priorityColors[p.priority]||'secondary'} bg-opacity-15 text-${priorityColors[p.priority]||'secondary'}" style="font-size:.72rem">${p.priority} Priority</span>
            </div>
            <h6 class="fw-bold mb-1">${p.name}</h6>
            <p class="text-muted mb-3" style="font-size:.8rem">${p.description||''}</p>
            <div class="d-flex justify-content-between text-muted mb-2" style="font-size:.78rem">
              <span><i class="bi bi-person me-1"></i>${p.manager}</span>
              <span><i class="bi bi-building me-1"></i>${p.client}</span>
            </div>
            <div class="d-flex justify-content-between text-muted mb-2" style="font-size:.78rem">
              <span><i class="bi bi-calendar-event me-1"></i>${formatDate(p.startDate)}</span>
              <span><i class="bi bi-calendar-check me-1"></i>${formatDate(p.dueDate)}</span>
            </div>
            <div class="d-flex align-items-center gap-2 mt-3">
              <div class="progress flex-1" style="height:6px"><div class="progress-bar bg-primary" style="width:${p.progress}%"></div></div>
              <span class="text-muted" style="font-size:.75rem">${p.progress}%</span>
            </div>
          </div>
          <div class="card-body border-top py-2 d-flex justify-content-end gap-2">
            <button class="btn btn-sm btn-outline-secondary edit-proj" data-id="${p.id}"><i class="bi bi-pencil me-1"></i>Edit</button>
            <button class="btn btn-sm btn-outline-danger del-proj" data-id="${p.id}"><i class="bi bi-trash me-1"></i>Delete</button>
          </div>
        </div>
      </div>`).join('')
      : `<div class="col-12"><div class="empty-state card"><i class="bi bi-kanban"></i><h6>No projects found</h6><p>Add a new project to get started.</p></div></div>`;

    document.querySelectorAll('.edit-proj').forEach(b => b.addEventListener('click', () => openEdit(+b.dataset.id)));
    document.querySelectorAll('.del-proj').forEach(b => b.addEventListener('click', () => delProj(+b.dataset.id)));
  }

  function openAdd() {
    editId=null;
    document.getElementById('projModalTitle').textContent = 'New Project';
    ['projName','projClient','projManager','projDesc'].forEach(id => document.getElementById(id).value = '');
    document.getElementById('projStatus').value = 'Planning';
    document.getElementById('projPriority').value = 'Medium';
    document.getElementById('projProgress').value = 0;
    document.getElementById('projStart').value = new Date().toISOString().split('T')[0];
    document.getElementById('projDue').value = '';
    projModal.show();
  }

  function openEdit(id) {
    editId = id;
    const p = projects.find(p => p.id === id); if (!p) return;
    document.getElementById('projModalTitle').textContent = 'Edit Project';
    document.getElementById('projName').value = p.name;
    document.getElementById('projClient').value = p.client;
    document.getElementById('projManager').value = p.manager;
    document.getElementById('projStatus').value = p.status;
    document.getElementById('projPriority').value = p.priority;
    document.getElementById('projStart').value = p.startDate;
    document.getElementById('projDue').value = p.dueDate;
    document.getElementById('projProgress').value = p.progress;
    document.getElementById('projDesc').value = p.description||'';
    projModal.show();
  }

  async function delProj(id) {
    const ok = await confirm('Delete this project? This action cannot be undone.');
    if (!ok) return;
    projects = projects.filter(p => p.id !== id);
    Storage.set('projects', projects);
    renderStats(); renderProjects();
    showToast('Project deleted.', 'danger');
  }

  function save() {
    const name = document.getElementById('projName').value.trim();
    if (!name) { showToast('Project name is required.', 'warning'); return; }
    const proj = {
      id: editId || genId(), name,
      client:   document.getElementById('projClient').value,
      manager:  document.getElementById('projManager').value,
      status:   document.getElementById('projStatus').value,
      priority: document.getElementById('projPriority').value,
      startDate:document.getElementById('projStart').value,
      dueDate:  document.getElementById('projDue').value,
      progress: parseInt(document.getElementById('projProgress').value)||0,
      description: document.getElementById('projDesc').value,
      team: []
    };
    if (editId) { const idx=projects.findIndex(p=>p.id===editId); if(idx!==-1) projects[idx]={...projects[idx],...proj}; }
    else projects.push(proj);
    Storage.set('projects', projects);
    projModal.hide();
    renderStats(); renderProjects();
    showToast(editId?'Project updated!':'Project created!', 'success');
  }

  init();

})();
</script>
</body>
</html>
